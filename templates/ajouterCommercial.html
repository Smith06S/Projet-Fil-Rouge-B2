{% extends 'base.html' %}
{% block content %}
<div class="form-wrapper">
    <h2>Espace Administration : Créer un compte Commercial</h2>
    <p>Formulaire d'intégration de personnel. Le matricule de l'employé sera généré de manière automatique.</p>
    
    <form action="{{ url_for('dashboard.ajouter_commercial') }}" method="POST" class="main-form">
        <div class="form-group">
            <label for="fname">Prénom du commercial</label>
            <input type="text" id="fname" name="fname" required placeholder="Ex: Marc">
        </div>
        <div class="form-group">
            <label for="lname">Nom du commercial</label>
            <input type="text" id="lname" name="lname" required placeholder="Ex: Lemaire">
        </div>
        <div class="form-group">
            <label for="email">Adresse Email Entreprise</label>
            <input type="email" id="email" name="email" required placeholder="m.lemaire@ymmo.fr">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe provisoire</label>
            <input type="password" id="password" name="password" required placeholder="********">
        </div>
        <div class="form-group">
            <label for="phone">Ligne Téléphonique Directe</label>
            <input type="tel" id="phone" name="phone" placeholder="0493000000">
        </div>
        <div class="form-group">
            <label for="id_agence">Affectation Initiale Agence</label>
            <select id="id_agence" name="id_agence" required>
                <option value="">-- Choisir une filiale --</option>
                {% for agence in agences %}
                    <option value="{{ agence.id_agence }}">{{ agence.nom }} ({{ agence.ville_agence or agence.ville }})</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn-submit">Valider l'embauche et créer le compte</button>
    </form>
</div>
{% endblock %}
