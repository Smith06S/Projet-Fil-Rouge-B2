{% extends 'base.html' %}
{% block title %}YMMO - Connexion{% endblock %}

{% block content %}
<section style="max-width: 400px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h1 style="text-align: center; margin-top: 0; color: #2c3e50;">Connexion Client & Agence</h1>

    {% if message %}
        <p style="color: #e74c3c; background: #fdeaea; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center;">
            {{ message }}
        </p>
    {% endif %}

    <form method="POST" action="/connexion">
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="email" style="display: block; margin-bottom: 8px; font-weight: bold;">Adresse Email :</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        
        <div class="form-group" style="margin-bottom: 25px;">
            <label for="password" style="display: block; margin-bottom: 8px; font-weight: bold;">Mot de passe :</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>
        
        <input type="submit" value="Se connecter " style="width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em;">
    </form>
</section>
{% endblock %}
