{% extends 'base.html' %}
{% block title %}YMMO - Connexion{% endblock %}

{% block content %}
<h2>Connexion à la plateforme</h2>
<form method="POST" action="{{ url_for('auth.connexion') }}" style="max-width: 300px;">
    <label>Adresse Email :</label><br>
    <input type="email" name="email" required style="width:100%; margin-bottom:10px;"><br>
    
    <label>Mot de passe :</label><br>
    <input type="password" name="password" required style="width:100%; margin-bottom:15px;"><br>
    
    <button type="submit">Se connecter</button>
</form>
{% endblock %}
