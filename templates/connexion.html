{% extends 'base.html' %}

{% block title %}Connexion - Ymmo{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 0 auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 20px;">Espace Connexion</h2>
        
        <form action="{{ url_for('connexion') }}" method="POST">
            <div>
                <label for="email" style="display:block; margin-bottom:4px;">Adresse Email</label>
                <input type="email" id="email" name="email" placeholder="exemple@domaine.com" required>
            </div>
            
            <div>
                <label for="password" style="display:block; margin-bottom:4px;">Mot de passe</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn" style="margin-top: 10px;">Se connecter</button>
        </form>
        
        <p style="text-align: center; margin-top: 16px; font-size: 0.9rem;">
            Pas encore de compte ? <a href="#" style="color: var(--accent-color);">Inscrivez-vous</a>
        </p>
    </div>
</div>
{% endblock %}
