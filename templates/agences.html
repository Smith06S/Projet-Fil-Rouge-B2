<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>YMMO - Agences</title>
</head>

<body>
    <h1>Liste des Agences</h1>
    {% for a in agences %}
    <div>
        <p>ID : {{ a.id }}</p>
        <p>Nom : {{ a.nom }}</p>
        <p>Ville : {{ a.ville }}</p>
        <p>Code postal : {{ a.code_postal }}</p>
    </div>
    {% endfor %}
</body>

</html>
