<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>YMMO - Agences</title>
</head>

<body>
    <h1>Liste des Agences</h1>
    {% for a in agences %}

        <p>{{ a.id_agence }}</p>
        <p>{{ a.nom_agence }}</p>
        <p>{{ a.ville }}</p>
        <p>{{ a.code_postal }}</p>
    </div>
    {% endfor %}
    </div>
</body>

</html>
