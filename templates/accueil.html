<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>YMMO - Utilisateurs</title>
    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px auto;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }
    </style>
</head>

<body>
    <h1>Carte des biens</h1>
    <!-- Section sémantique pour l'accueil -->
    <section id="accueil-carte" style="margin: 20px 0; text-align: center;">
        <h2>Localisation de nos biens</h2>

        <!-- Conteneur spécifique pour le rendu de la carte -->
        <div class="map-container"
            style="width: 90%; height: 500px; margin: 0 auto; border: 2px solid #333; border-radius: 8px; overflow: hidden;">
            {% include 'carte_dyn.html' %}
        </div>
    </section>

    <h1>Liste des Agences</h1>
    {% for a in agences %}
    <div>
        <p>{{ a.id }}</p>
        <p>{{ a.nom }}</p>
        <p>{{ a.prenom }}</p>
        <p>{{ a.email }}</p>
        <p>{{ a.telephone }}</p>
        <p>{{ a.role }}</p>
    </div>
    {% endfor %}
</body>

</html>
