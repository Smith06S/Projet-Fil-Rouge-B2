<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>YMMO - Visualisation de la base</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 30px; }
        h1 { color: #333; text-align: center; }
        table { border-collapse: collapse; width: 100%; max-width: 800px; margin: 20px auto; background: white; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Données de la table PostgreSQL</h1>

    <table>
        <thead>
            <tr>
                {% for col in columns %}
                    <th>{{ col }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                {% for cell in row %}
                    <td>{{ cell }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>

    {% if not data %}
        <p style="text-align: center;">Aucune donnée trouvée.</p>
    {% endif %}
</body>
</html>
