{% extends 'base.html' %}
{% block title %}YMMO - Publier une annonce immobilière{% endblock %}

{% block content %}
<section class="mise-en-vente-section">
    <h1>Enregistrer un bien</h1>
    <p>Catalogue agence ID : {{ session.get('id_agence') }}</p>

    <form method="POST" action="{{ url_for('bien.creation_bien') }}" enctype="multipart/form-data">
        
        <div class="form-grid" style="grid-template-columns: 1fr 1fr;">
            <div class="form-field"><label>Ville d'implantation :</label><input type="text" name="ville" required></div>
            <div class="form-field"><label>Adresse Complète :</label><input type="text" name="adresse" required></div>
        </div>

        <div class="form-field">
            <label>Description Commerciale :</label>
            <textarea name="description" rows="4" required></textarea>
        </div>

        <div class="form-grid">
            <div class="form-field"><label>Nombre de pièces :</label><input type="number" name="nbrPieces" min="1" required></div>
            <div class="form-field"><label>Nombre de chambres :</label><input type="number" name="nbrChambres" min="0" value="0" required></div>
            <div class="form-field"><label>Superficie (m²) :</label><input type="number" step="0.01" name="surface" required></div>
        </div>

        <div class="form-grid">
            <div class="form-field"><label>Type de bien :</label>
                <select name="typeBien">
                    <option value="Maison">Maison</option>
                    <option value="Appartement">Appartement</option>
                    <option value="Bureau">Bureau</option>
                    <option value="Local">Local</option>
                </select>
            </div>
            <div class="form-field">
                <label>Étage (Si appartement) :</label>
                <input type="text" name="etage" value="Rez-de-chaussée">
            </div>
            <div class="form-field"><label>État du logement :</label>
                <select name="etat_logement">
                    <option value="Neuf">Neuf</option>
                    <option value="Bon état">Bon état</option>
                    <option value="À rafraîchir">À rafraîchir</option>
                    <option value="À rénover">À rénover</option>
                </select>
            </div>
        </div>

        <div class="form-grid">
            <div class="form-field"><label>Type de chauffage :</label>
                <select name="type_chauffage">
                    <option value="Individuel Électrique">Individuel Électrique</option>
                    <option value="Collectif Gaz">Collectif Gaz</option>
                    <option value="Pompe à chaleur">Pompe à chaleur</option>
                    <option value="Non renseigné">Autre / Non renseigné</option>
                </select>
            </div>
            <div class="form-field"><label>Année de Construction :</label>
                <input type="number" name="annee_construction" placeholder="Ex: 2012">
            </div>
            <div class="form-field"><label>Prix Final Attendu (€) :</label>
                <input type="number" step="0.01" name="prix" required>
            </div>
        </div>

        <div class="checkbox-container">
            <label><input type="checkbox" name="a_balcon"> Balcon / Terrasse</label>
            <label><input type="checkbox" name="a_parking"> Parking / Garage</label>
            <label><input type="checkbox" name="a_ascenseur"> Ascenseur</label>
        </div>

        <div class="form-field">
            <label><b>Ajouter les photos du catalogue :</b></label>
            <input type="file" name="photos" accept="image/*" multiple>
        </div>
        
        <button type="submit" class="submit-btn">Enregistrer et publier officiellement l'annonce</button>
    </form>
</section>
{% endblock %}
