{%- extends 'base.html' -%}

{% block title %}YMMO - Contact{% endblock %}

{% block content %}
<section class="formulaire-contact-section">
  <h2>Contactez-nous</h2>
  <form action="{{ url_for('agence.contact') }}" method="post">
    <div class="contact-form-group">
      <label for="nom">Nom :</label>
      <input type="text" id="nom" placeholder="Entrez votre nom" name="nom" required>
    </div>
    <div class="contact-form-group">
      <label for="email">Email :</label>
      <input type="email" id="email" placeholder="example@domain.com" name="email" required>
    </div>
    <div class="contact-form-group">
      <label for="message">Message :</label>
      <textarea id="message" name="message" placeholder="Entrez votre message" rows="5" required></textarea>
    </div>
    <button type="submit" class="formulaire-contact-btn">Envoyer</button>
  </form>
</section>
{% endblock %}
