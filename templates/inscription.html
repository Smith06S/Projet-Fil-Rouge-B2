{% extends 'base.html' %}
{% block title %}YMMO - Inscription{% endblock %}

{% block content %}
<section style="max-width: 500px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h1 style="text-align: center; margin-top: 0; color: #2c3e50;">Créer un compte</h1>

    {% if message %}
        <p style="color: #27ae60; background: #e8f8f0; padding: 10px; border-radius: 4px; font-weight: bold; text-align: center;">
            {{ message }}
        </p>
    {% endif %}

    <form method="POST" action="/inscription">
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label for="fname" style="display: block; margin-bottom: 5px; font-weight: bold;">Prénom :</label>
                <input type="text" id="fname" name="fname" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="flex: 1;">
                <label for="lname" style="display: block; margin-bottom: 5px; font-weight: bold;">Nom :</label>
                <input type="text" id="lname" name="lname" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold;">Email :</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold;">Mot de passe :</label>
            <input type="password" id="password" name="password" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="phone" style="display: block; margin-bottom: 5px; font-weight: bold;">Numéro de téléphone :</label>
            <input type="text" id="phone" name="phone" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 25px;">
            <label for="role" style="display: block; margin-bottom: 5px; font-weight: bold;">Type de profil (Rôle) :</label>
            <select id="role" name="role" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; background: white;">
                <option value="client">Client (Particulier / Pro)</option>
                <option value="commercial">Commercial (Conseiller agence)</option>
                <option value="admin">Administrateur Système</option>
            </select>
        </div>

        <input type="submit" value="S'inscrire sur YMMO 🚀" style="width: 100%; background-color: #2ecc71; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 1em;">
    </
